<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0E1420" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Dividendes" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>Calendrier Dividendes</title>
<meta name="description" content="Calendrier de dividendes et de résultats trimestriels pour votre portefeuille d'actions." />
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
/* ============================================================
   DESIGN TOKENS
   Thème "Poste de contrôle" — terminal financier personnel :
   fond profond façon salle des marchés nocturne, cyan (données/
   dividendes) + violet (résultats) + ambre (argent), plutôt qu'un
   simple noir + un néon unique. Verre dépoli, lueurs discrètes.
   ============================================================ */
:root{
  --paper: #0E1420;
  --paper-alt: #182136;
  --card: #131B2C;
  --ink: #E7EEF7;
  --ink-soft: #8A99B3;
  --forest: #2DE2E6;
  --forest-deep: #17B8C4;
  --forest-tint: #16273A;
  --gold: #FFB454;
  --gold-tint: #2A2013;
  --navy: #9D6BFF;
  --navy-tint: #211A38;
  --line: #263349;
  --danger: #FF5C7A;
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 14px;
  --shadow: 0 2px 14px rgba(0,0,0,0.45), 0 0 0 1px rgba(45,226,230,0.05);
  --shadow-lg: 0 24px 70px rgba(0,0,0,0.6), 0 0 44px rgba(45,226,230,0.10);
  --font-display: 'Space Grotesk', sans-serif;
  --font-body: 'Inter', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
}

*{ box-sizing: border-box; }
html{ scroll-behavior: smooth; }
body{
  margin:0;
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(45,226,230,0.10), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 10%, rgba(157,107,255,0.09), transparent 55%),
    linear-gradient(var(--line) 1px, transparent 1px) 0 0/100% 42px,
    var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  padding-bottom: 60px;
}
h1,h2,h3{ font-family: var(--font-display); margin:0; font-weight:600; }
button{ font-family: var(--font-body); cursor:pointer; }
input, select{ font-family: var(--font-body); }
.mono{ font-family: var(--font-mono); }

a{ color: var(--forest); }

/* Skip link / focus visibility */
:focus-visible{ outline: 2px solid var(--forest); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce){
  *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}

/* ============================================================
   HEADER
   ============================================================ */
.site-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding: 28px clamp(16px,4vw,48px) 18px;
  flex-wrap: wrap;
}
.brand{ display:flex; align-items:center; gap:14px; }
.brand-mark{
  width:46px; height:46px; border-radius: 10px;
  background: linear-gradient(135deg, var(--forest), var(--navy));
  color: var(--paper);
  display:flex; align-items:center; justify-content:center;
  font-family: var(--font-mono); font-weight:700; font-size: 20px;
  box-shadow: var(--shadow), 0 0 24px rgba(45,226,230,0.4);
  flex-shrink:0;
}
.brand h1{ font-size: clamp(22px,3vw,30px); letter-spacing: -0.01em; }
.brand .tagline{ margin:2px 0 0; color: var(--ink-soft); font-size: 13.5px; }
.header-actions{ display:flex; gap:10px; align-items:center; }

.btn{
  border:none; border-radius: 999px; padding: 10px 18px;
  font-size: 14px; font-weight:600; display:inline-flex; align-items:center; gap:8px;
  transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
}
.btn:active{ transform: translateY(1px); }
.btn-primary{ background: linear-gradient(135deg, var(--forest), var(--navy)); color: var(--paper); font-weight:700; box-shadow: var(--shadow), 0 0 20px rgba(45,226,230,0.25); }
.btn-primary:hover{ background: var(--forest-deep); }
.btn-ghost{ background: transparent; color: var(--ink); border:1px solid var(--line); }
.btn-ghost:hover{ background: var(--paper-alt); }
.btn-icon{ width:40px; height:40px; padding:0; border-radius: 50%; display:flex; align-items:center; justify-content:center; font-size:17px; }
.btn-danger{ background: transparent; color: var(--danger); border:1px solid rgba(162,59,46,0.35); }
.btn-danger:hover{ background: rgba(162,59,46,0.08); }
.btn-sm{ padding:6px 12px; font-size:12.5px; }

/* ============================================================
   TICKER TAPE — signature "HUD" : bandeau scanline lumineux
   ============================================================ */
.ticker-tape{
  background: linear-gradient(180deg, #0A0F1A, #0D1424);
  overflow: hidden;
  position: relative;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  box-shadow: inset 0 0 30px rgba(45,226,230,0.06);
}
.ticker-tape::before, .ticker-tape::after{
  content:""; position:absolute; top:0; bottom:0; width:60px; z-index:2; pointer-events:none;
}
.ticker-tape::before{ left:0; background: linear-gradient(90deg, #0A0F1A, transparent); }
.ticker-tape::after{ right:0; background: linear-gradient(270deg, #0A0F1A, transparent); }
.ticker-track{
  display:flex; white-space:nowrap; width:max-content;
  animation: ticker-scroll 38s linear infinite;
  padding: 10px 0;
}
.ticker-tape:hover .ticker-track{ animation-play-state: paused; }
@keyframes ticker-scroll{
  from{ transform: translateX(0); }
  to{ transform: translateX(-50%); }
}
@keyframes scanline-glow{
  0%, 100%{ opacity: .5; }
  50%{ opacity: 1; }
}
.ticker-item{
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--ink-soft);
  padding: 0 22px;
  display:flex; align-items:center; gap:8px;
  border-right: 1px solid var(--line);
}
.ticker-item::before{
  content:""; width:6px; height:6px; border-radius:50%; background: var(--forest);
  box-shadow: 0 0 8px var(--forest); animation: scanline-glow 2.2s ease-in-out infinite;
}
.ticker-item .tk{ color: var(--ink); font-weight:700; }
.ticker-item .amt-div{ color: var(--gold); text-shadow: 0 0 10px rgba(255,180,84,0.35); }
.ticker-item .amt-earn{ color: var(--navy); text-shadow: 0 0 10px rgba(157,107,255,0.35); }
.ticker-empty{ font-family: var(--font-mono); font-size:13px; color: var(--ink-soft); padding: 10px 22px; }

/* ============================================================
   TOOLBAR
   ============================================================ */
.toolbar{
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  flex-wrap:wrap;
  padding: 16px clamp(16px,4vw,48px);
}
.view-switch{
  display:inline-flex; background: var(--paper-alt); border-radius: 999px; padding:3px; border:1px solid var(--line);
}
.view-switch button{
  border:none; background:transparent; padding:7px 16px; border-radius:999px; font-size:13.5px; font-weight:600; color: var(--ink-soft);
}
.view-switch button.active{ background: var(--forest); color:var(--paper); font-weight:700; }

.toolbar-accounts{
  display:flex; align-items:center; justify-content:flex-start; gap:12px; flex-wrap:wrap;
  padding: 14px clamp(16px,4vw,48px) 0;
}
.toolbar-accounts .view-switch{ flex-wrap:wrap; }

.date-nav{ display:flex; align-items:center; gap:10px; }
.date-nav button{ background:none; border:1px solid var(--line); width:32px; height:32px; border-radius:50%; font-size:16px; color:var(--ink); }
.date-nav button:hover{ background: var(--paper-alt); }
#periodLabel{ font-family: var(--font-display); font-size: 19px; min-width: 150px; text-align:center; }
#todayBtn{ border-radius: 999px; width:auto; padding: 6px 14px; font-size:12.5px; font-weight:600; }

.filters{ display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
.filters label{ font-size: 13px; color: var(--ink-soft); display:flex; align-items:center; gap:7px; }
.filters select{
  border:1px solid var(--line); border-radius: 8px; padding:6px 10px; background:var(--card); color:var(--ink); font-size:13px;
}
.checkbox{ user-select:none; }
.checkbox input{ width:16px; height:16px; accent-color: var(--forest); }

/* ============================================================
   LAYOUT
   ============================================================ */
.layout{
  display:grid; grid-template-columns: 1fr 320px; gap: 22px;
  padding: 0 clamp(16px,4vw,48px) 20px;
  align-items:start;
}
@media (max-width: 980px){
  .layout{ grid-template-columns: 1fr; }
}
.calendar-wrap{ min-width:0; }
.sidebar{
  background: var(--card); border:1px solid var(--line); border-radius: var(--radius-lg);
  padding: 20px; box-shadow: var(--shadow); position: sticky; top: 16px;
}
.sidebar h2{ font-size:18px; margin-bottom:14px; }

/* ============================================================
   HOLDINGS LIST (sidebar)
   ============================================================ */
.holdings-list{ display:flex; flex-direction:column; gap:8px; max-height: 46vh; overflow-y:auto; padding-right:2px; }
.holding-row{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius: var(--radius-sm);
  border:1px solid var(--line); background: var(--paper);
}
.holding-row:hover{ background: var(--forest-tint); }
.avatar{
  width:32px; height:32px; border-radius:50%; flex-shrink:0; overflow:hidden;
  display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700; color:#fff;
  font-family: var(--font-mono);
}
.avatar img{ width:100%; height:100%; object-fit:contain; background:#fff; }
.holding-meta{ flex:1; min-width:0; }
.holding-meta .tk{ font-family: var(--font-mono); font-weight:600; font-size:13px; }
.holding-meta .nm{ font-size:11.5px; color: var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.holding-qty{ font-family: var(--font-mono); font-size:12px; color: var(--ink-soft); }
.holding-edit{ background:none; border:none; color: var(--ink-soft); font-size:15px; padding:4px; border-radius:6px; }
.holding-edit:hover{ background: var(--paper-alt); color:var(--ink); }
.holdings-group-label{
  font-family: var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em;
  color: var(--ink-soft); margin: 12px 0 5px; padding-top:10px; border-top:1px dashed var(--line);
}
.acct-badge{ font-size:10px; padding:2px 7px; border-radius:999px; background:var(--paper-alt); color:var(--ink-soft); border:1px solid var(--line); font-weight:600; white-space:nowrap; }
.account-row{ display:flex; gap:8px; align-items:center; margin-bottom:8px; }
.account-row input{ flex:1; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13.5px; background:var(--card); color:var(--ink); }
.empty-state{ text-align:center; padding: 26px 10px; color: var(--ink-soft); font-size:13.5px; }
.empty-state .em-icon{ font-size:26px; display:block; margin-bottom:8px; }

.sidebar-summary{ margin-top:18px; padding-top:16px; border-top:1px dashed var(--line); }
.sum-row{ display:flex; justify-content:space-between; align-items:baseline; font-size:13px; padding:4px 0; }
.sum-row .lbl{ color: var(--ink-soft); }
.sum-row .val{ font-family: var(--font-mono); font-weight:600; }
.sum-row .val.gold{ color: var(--gold); }

.sidebar-footer{ margin-top:16px; display:flex; gap:8px; flex-wrap:wrap; }

/* ============================================================
   CALENDAR — YEAR VIEW
   ============================================================ */
.year-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:16px; }
@media (max-width: 1400px){ .year-grid{ grid-template-columns: repeat(2,1fr); } }
@media (max-width: 700px){ .year-grid{ grid-template-columns: 1fr; } }

.mini-month{
  background: var(--card); border:1px solid var(--line); border-radius: var(--radius);
  padding:14px; box-shadow: var(--shadow); cursor:pointer;
  transition: box-shadow .15s ease, transform .15s ease;
}
.mini-month:hover{ box-shadow: var(--shadow-lg); transform: translateY(-2px); }
.mini-month h3{ font-size:15px; margin-bottom:10px; text-transform:capitalize; }
.mini-grid{ display:grid; grid-template-columns: repeat(7,1fr); gap:3px; }
.mini-dow{ font-size:9.5px; text-align:center; color: var(--ink-soft); font-family: var(--font-mono); }
.mini-day{
  aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:10.5px; border-radius:5px; color: var(--ink-soft); position:relative; font-family: var(--font-mono);
}
.mini-day.pad{ visibility:hidden; }
.mini-day.today{ background: var(--forest); color:var(--paper); font-weight:700; border-radius:50%; }
.mini-day .dots{ display:flex; gap:2px; position:absolute; bottom:2px; }
.mini-day .dot{ width:4px; height:4px; border-radius:50%; }
.dot-div{ background: var(--gold); }
.dot-earn{ background: var(--navy); }

/* ============================================================
   CALENDAR — MONTH VIEW
   ============================================================ */
.month-card{
  background: var(--card); border:1px solid var(--line); border-radius: var(--radius-lg);
  padding: 18px; box-shadow: var(--shadow);
}
.month-grid{ display:grid; grid-template-columns: repeat(7,1fr); gap:8px; margin-top:10px; }
.month-dow{ font-size:11.5px; text-align:center; color: var(--ink-soft); font-family: var(--font-mono); text-transform:uppercase; letter-spacing:.04em; padding-bottom:4px; }
.month-day{
  min-height: 108px; border:1px solid var(--line); border-radius: var(--radius-sm);
  padding:7px; background: var(--paper); display:flex; flex-direction:column; gap:5px;
  cursor:pointer; transition: background .12s ease, border-color .12s ease;
}
.month-day:hover{ border-color: var(--forest); }
.month-day.pad{ visibility:hidden; }
.month-day .daynum{ font-family: var(--font-mono); font-size:12px; color: var(--ink-soft); }

/* ============================================================
   CALENDRIER — VUE LOGOS
   ============================================================ */
.logo-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:16px; }
@media (max-width: 1400px){ .logo-grid{ grid-template-columns: repeat(2,1fr); } }
@media (max-width: 700px){ .logo-grid{ grid-template-columns: 1fr; } }
.logo-month-card{
  background: var(--card); border:1px solid var(--line); border-radius: var(--radius);
  padding:16px; box-shadow: var(--shadow); min-height:118px;
}
.logo-month-card h3{ font-size:15px; margin-bottom:12px; text-transform:capitalize; }
.logo-avatar-list{ display:flex; flex-wrap:wrap; gap:10px; }
.logo-avatar-item{
  width:42px; height:42px; border-radius:50%; overflow:hidden; cursor:pointer;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  border:2px solid var(--paper); box-shadow: 0 0 0 1px var(--line);
  transition: transform .12s ease;
}
.logo-avatar-item:hover{ transform: translateY(-2px) scale(1.06); }
.logo-avatar-item img{ width:100%; height:100%; object-fit:contain; background:#fff; }
.logo-avatar-item.is-earnings{ box-shadow: 0 0 0 2px var(--navy); }
.logo-avatar-item.is-estimate{ opacity:.55; }
.logo-month-empty{ color: var(--ink-soft); font-size:12.5px; font-style:italic; }
.logo-legend{ display:flex; gap:16px; flex-wrap:wrap; padding: 2px clamp(16px,4vw,48px) 14px; font-size:12px; color: var(--ink-soft); }
.logo-legend span{ display:inline-flex; align-items:center; gap:6px; }
.logo-legend .dot{ width:10px; height:10px; border-radius:50%; display:inline-block; }
.month-day.today .daynum{
  background: var(--forest); color:var(--paper); width:20px; height:20px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
}
.day-chips{ display:flex; flex-direction:column; gap:3px; overflow:hidden; }
.chip{
  display:flex; align-items:center; gap:4px; font-size:10.5px; padding:2.5px 5px; border-radius: 5px;
  font-family: var(--font-mono); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.chip-div{ background: var(--gold-tint); color: #7A5B14; }
.chip-earn{ background: var(--navy-tint); color: var(--navy); }
.chip.estimate{ opacity:0.62; border:1px dashed currentColor; background:transparent; }
.chip-more{ font-size:10px; color: var(--ink-soft); padding-left:2px; }

/* ============================================================
   MODALS
   ============================================================ */
.modal-overlay{
  position:fixed; inset:0; background: rgba(18,52,36,0.35); backdrop-filter: blur(2px);
  display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
  animation: fade-in .15s ease;
}
@keyframes fade-in{ from{opacity:0;} to{opacity:1;} }
.modal{
  background: var(--paper); border-radius: var(--radius-lg); max-width: 560px; width:100%;
  max-height: 88vh; overflow-y:auto; box-shadow: var(--shadow-lg); padding: 26px 28px 28px;
  border:1px solid var(--line);
}
.modal h2{ font-size:21px; margin-bottom:4px; }
.modal .modal-sub{ color: var(--ink-soft); font-size:13px; margin-bottom:18px; }
.modal-close{ float:right; background:none; border:none; font-size:20px; color: var(--ink-soft); }
.field-row{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-bottom:12px; }
.field{ display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
.field label{ font-size:12.5px; font-weight:600; color: var(--ink-soft); }
.field input, .field select{
  border:1px solid var(--line); border-radius: 8px; padding:9px 11px; font-size:14px; background: var(--card); color: var(--ink);
}
.field input:focus, .field select:focus{ border-color: var(--forest); }
.field .hint{ font-size:11px; color: var(--ink-soft); }
.section-title{
  font-family: var(--font-mono); font-size:11.5px; text-transform:uppercase; letter-spacing:.06em;
  color: var(--forest); margin: 18px 0 10px; padding-top:14px; border-top:1px dashed var(--line);
  display:flex; align-items:center; justify-content:space-between;
}
.auto-fetch-row{ display:flex; align-items:center; gap:10px; margin: 6px 0 16px; }
.auto-fetch-status{ font-size:12.5px; color: var(--ink-soft); }
.auto-fetch-status.ok{ color: var(--forest); }
.auto-fetch-status.err{ color: var(--danger); }
.modal-actions{ display:flex; justify-content:space-between; gap:10px; margin-top: 22px; }
.modal-actions .right{ display:flex; gap:8px; }

.day-popover-list{ display:flex; flex-direction:column; gap:10px; }
.day-event{ display:flex; gap:12px; align-items:flex-start; padding:12px; border:1px solid var(--line); border-radius: var(--radius-sm); background: var(--card); }
.day-event .info{ flex:1; }
.day-event .info .top{ display:flex; align-items:center; gap:8px; }
.day-event .info .tk{ font-family: var(--font-mono); font-weight:700; }
.day-event .info .nm{ font-size:12.5px; color: var(--ink-soft); }
.badge{ font-size:10px; padding:2px 7px; border-radius:999px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; }
.badge-div{ background: var(--gold-tint); color:#7A5B14; }
.badge-earn{ background: var(--navy-tint); color: var(--navy); }
.badge-est{ background: var(--paper-alt); color: var(--ink-soft); border:1px dashed var(--line); }
.day-event .amount{ font-family: var(--font-mono); font-weight:700; margin-top:4px; }

.entries-list{ display:flex; flex-direction:column; gap:6px; margin-bottom: 8px; }
.entry-item{ display:grid; grid-template-columns: 1fr 1fr 1fr auto; gap:6px; align-items:center; background: var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 8px; }
.entry-item input{ border:1px solid var(--line); border-radius:6px; padding:5px 6px; font-size:12.5px; }
.entry-remove{ background:none; border:none; color: var(--danger); font-size:15px; }
.add-entry-btn{ font-size:12px; }

.toast{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  background: var(--card); border:1px solid var(--forest); color:var(--ink); padding:11px 20px; border-radius:999px;
  font-size:13.5px; box-shadow: var(--shadow-lg); z-index:200; animation: fade-in .15s ease;
}

footer.app-footer{
  text-align:center; color: var(--ink-soft); font-size:12px; padding: 30px 20px 0;
}

/* ============================================================
   STATISTIQUES / GRAPHIQUES
   ============================================================ */
.stats-section{
  display:grid; grid-template-columns: 1.2fr 1fr; gap:22px;
  padding: 4px clamp(16px,4vw,48px) 8px;
}
@media (max-width: 980px){ .stats-section{ grid-template-columns: 1fr; } }
.stats-card{
  background: var(--card); border:1px solid var(--line); border-radius: var(--radius-lg);
  padding: 20px 22px; box-shadow: var(--shadow);
}
.stats-card h3{ font-size:16px; }
.stats-sub{ font-size:12px; color: var(--ink-soft); margin: 3px 0 14px; }
.chart-block + .chart-block{ margin-top:18px; padding-top:16px; border-top:1px dashed var(--line); }
.chart-cur-label{ font-family: var(--font-mono); font-size:11px; font-weight:600; color: var(--ink-soft); margin-bottom:4px; text-transform:uppercase; letter-spacing:.04em; }
.chart-svg{ width:100%; height:auto; display:block; }

.chart-totals-wrap{ margin-top:0; }
.chart-totals{ font-size:13px; font-weight:600; color: var(--ink); }
.chart-total-pill{ display:inline-flex; align-items:baseline; gap:4px; margin-right:14px; }
.chart-total-pill strong{ font-family: var(--font-mono); color: var(--forest); }
.chart-account-breakdown{ margin-top:6px; display:flex; flex-direction:column; gap:2px; }
.chart-account-row{ display:flex; justify-content:space-between; font-size:12px; color: var(--ink-soft); padding:1px 0 1px 4px; }
.chart-account-row .mono{ font-family: var(--font-mono); color: var(--ink); }

.region-table-wrap{ margin-top:12px; overflow-x:auto; }
.region-totals-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
.region-totals-table th{
  text-align:left; font-family: var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.04em;
  color: var(--ink-soft); padding: 4px 8px; border-bottom:1px solid var(--line);
}
.region-totals-table td{ padding: 6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
.region-totals-table td:first-child, .region-totals-table th:first-child{ white-space:normal; }
.region-totals-table .mono{ font-family: var(--font-mono); }
.region-total-col{ font-weight:700; color: var(--forest); }
.region-grand-total td{ border-top:2px solid var(--forest); border-bottom:none; font-weight:700; padding-top:8px; }
.chart-total-eur{ color: var(--gold); text-shadow: 0 0 12px rgba(255,180,84,0.3); font-family: var(--font-mono); font-size:15px; }
.fx-caption{ margin-top:8px; font-size:11px; color: var(--ink-soft); font-family: var(--font-mono); }
.fx-pending{ color: var(--ink-soft); font-style: italic; }
.fx-missing{ color: var(--gold); cursor: help; }

/* import mapping preview table */
.import-preview-wrap{ max-height:180px; overflow:auto; border:1px solid var(--line); border-radius:8px; margin-top:8px; }
.import-preview-wrap table{ width:100%; border-collapse:collapse; font-size:11.5px; }
.import-preview-wrap td{ border-bottom:1px solid var(--line); padding:5px 8px; white-space:nowrap; }

/* recherche d'entreprise par nom (autocomplétion) */
.ticker-suggest-list{
  position:absolute; top:100%; left:0; right:0; margin-top:4px; z-index:20;
  background: var(--card); border:1px solid var(--line); border-radius: var(--radius-sm);
  max-height: 230px; overflow-y:auto; box-shadow: var(--shadow-lg);
}
.ticker-suggest-item{
  display:flex; align-items:center; gap:8px; padding:8px 12px; font-size:13px; cursor:pointer;
}
.ticker-suggest-item:hover{ background: var(--forest-tint); }
.ticker-suggest-item .tk{ font-family: var(--font-mono); font-weight:700; color: var(--forest); flex-shrink:0; }
.ticker-suggest-item .nm{ flex:1; color: var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ticker-suggest-item .ex{ font-size:10.5px; color: var(--ink-soft); flex-shrink:0; }

/* ============================================================
   MISE EN PAGE TÉLÉPHONE — 4 écrans + barre d'onglets
   (le thème « poste de contrôle » ci-dessus est conservé)
   ============================================================ */
html{ -webkit-text-size-adjust:100%; }
body{ padding: env(safe-area-inset-top,0px) 0 calc(92px + env(safe-area-inset-bottom,0px)); overscroll-behavior-y: none; }
button{ touch-action: manipulation; }

.app-bar{
  position: sticky; top:0; z-index:30;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding: calc(10px + env(safe-area-inset-top,0px)) 16px 8px;
  margin-top: calc(-1 * env(safe-area-inset-top,0px));
  background: rgba(14,20,32,.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.app-bar h1{ font-size:22px; letter-spacing:-.01em; }
.app-bar-actions{ display:flex; gap:8px; }
.app-bar .btn-icon{ width:44px; height:44px; font-size:18px; }

.chips{ display:flex; gap:8px; overflow-x:auto; padding: 12px 16px 4px; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
.chips::-webkit-scrollbar{ display:none; }
.chips button{
  flex:0 0 auto; min-height:40px; padding:0 16px; border-radius:999px;
  border:1px solid var(--line); background:var(--card); color:var(--ink-soft);
  font-size:14px; font-weight:600; white-space:nowrap;
}
.chips button.active{ background:var(--forest); border-color:var(--forest); color:var(--paper); font-weight:700; }

.screens{ max-width:720px; margin:0 auto; padding: 0 16px; }
.screen{ display:none; }
.screen.active{ display:block; }
.screen-title{ font-size:20px; margin: 18px 0 12px; }
.screen-title small{ display:block; font-family:var(--font-body); font-weight:400; font-size:13px; color:var(--ink-soft); margin-top:3px; }

/* bannière rappels */
.notif-banner{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  margin: 14px 0 0; padding:12px 14px; border-radius:var(--radius-lg);
  background:var(--forest-tint); border:1px solid rgba(45,226,230,.28);
}
.notif-banner[hidden]{ display:none; }
.nb-text{ display:flex; flex-direction:column; gap:2px; font-size:13px; color:var(--ink-soft); min-width:0; }
.nb-text b{ color:var(--ink); font-size:14px; }
.nb-actions{ display:flex; gap:6px; flex-shrink:0; }
.nb-actions .btn{ min-height:40px; }

/* prochain versement */
.next-pay{
  margin-top:18px; padding:18px 18px 18px 20px; background:var(--card);
  border:1px solid var(--line); border-left:4px solid var(--gold); border-radius:var(--radius-lg);
}
.next-when{ font-size:14px; color:var(--ink-soft); font-weight:600; }
.next-amount{ font-family:var(--font-display); font-size:38px; font-weight:700; color:var(--gold); line-height:1.1; margin:6px 0 4px; letter-spacing:-.02em; }
.next-who{ font-size:14px; color:var(--ink); }

/* liste par mois */
.pay-month{ margin-top:22px; }
.pay-month-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:0 4px 8px; }
.pay-month-head h3{ font-size:16px; text-transform:capitalize; }
.pay-month-total{ font-family:var(--font-mono); font-size:14px; font-weight:600; color:var(--gold); }
.pay-row{
  display:grid; grid-template-columns: 46px 40px 1fr auto; align-items:center; gap:12px;
  width:100%; min-height:68px; padding:10px 14px; text-align:left; color:var(--ink);
  background:var(--card); border:0; border-bottom:1px solid var(--line);
}
.pay-month > .pay-row:first-of-type{ border-radius:var(--radius-lg) var(--radius-lg) 0 0; }
.pay-month > .pay-row:last-of-type{ border-radius:0 0 var(--radius-lg) var(--radius-lg); border-bottom:0; }
.pay-month > .pay-row:only-of-type{ border-radius:var(--radius-lg); }
.pay-row:active{ background:var(--paper-alt); }
.pay-row.is-today{ box-shadow: inset 4px 0 0 var(--gold); }
.pay-day{ display:flex; flex-direction:column; align-items:center; line-height:1.1; }
.pay-day b{ font-family:var(--font-display); font-size:20px; }
.pay-day span{ font-size:11px; color:var(--ink-soft); }
.pay-meta{ min-width:0; }
.pay-meta .tk{ font-family:var(--font-mono); font-weight:600; font-size:14px; }
.pay-meta .nm{ font-size:12.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pay-amt{ text-align:right; display:flex; flex-direction:column; }
.pay-amt b{ font-family:var(--font-mono); font-size:15px; color:var(--gold); }
.pay-amt span{ font-size:11.5px; color:var(--ink-soft); }
.more-btn{ width:100%; justify-content:center; min-height:48px; margin-top:20px; }
.fine-print{ font-size:12px; color:var(--ink-soft); text-align:center; margin:14px 8px 0; line-height:1.45; }
.empty-state.big{ padding:48px 16px; font-size:15px; line-height:1.5; }
.empty-state.big .em-icon{ font-size:34px; }

/* calendrier */
.cal-controls{ display:flex; flex-direction:column; gap:12px; margin-bottom:14px; }
.cal-controls .view-switch{ align-self:stretch; display:grid; grid-auto-flow:column; grid-auto-columns:1fr; }
.cal-controls .view-switch button{ min-height:42px; font-size:14px; }
.cal-controls .date-nav{ justify-content:space-between; }
.cal-controls .date-nav button{ width:44px; height:44px; font-size:18px; }
.cal-controls #todayBtn{ width:auto; height:44px; padding:0 16px; }
#periodLabel{ min-width:0; flex:1; font-size:19px; }
.cal-controls .filters{ justify-content:space-between; gap:12px; }
.cal-controls .filters select{ min-height:40px; font-size:15px; }
.logo-legend{ padding:0 0 12px; }
.month-card{ padding:12px; }
.month-grid{ gap:4px; }
.month-day{ min-height:54px; padding:5px 4px; }
.month-day.today{ border-color:var(--forest); }

/* portefeuille */
.holdings-list{ max-height:none; overflow:visible; padding-right:0; gap:0; }
.holdings-group-label{ margin:20px 4px 8px; font-size:13px; color:var(--ink-soft); font-weight:700; }
.holding-row{
  display:flex; align-items:center; gap:12px; width:100%; min-height:72px; padding:10px 14px;
  background:var(--card); border:0; border-bottom:1px solid var(--line); color:var(--ink); text-align:left; border-radius:0;
}
.holdings-group-label + .holding-row, .holdings-list > .holding-row:first-child{ border-radius:var(--radius-lg) var(--radius-lg) 0 0; }
.holding-row:last-child, .holding-row:has(+ .holdings-group-label){ border-radius:0 0 var(--radius-lg) var(--radius-lg); border-bottom:0; }
.holding-row:only-child{ border-radius:var(--radius-lg); }
.holding-row:active{ background:var(--paper-alt); }
.holding-meta .tk{ font-size:14px; }
.holding-meta .tk .qty{ color:var(--ink-soft); font-weight:400; margin-left:4px; }
.holding-meta .nm{ font-size:12.5px; }
.holding-meta .sched{ font-size:12px; color:var(--forest); margin-top:2px; }
.holding-year{ text-align:right; display:flex; flex-direction:column; flex-shrink:0; }
.holding-year b{ font-family:var(--font-mono); font-size:14px; color:var(--gold); }
.holding-year span{ font-size:11.5px; color:var(--ink-soft); }
.portfolio-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius-lg); padding:14px 16px; margin-bottom:6px; }
.sum-row{ font-size:14px; padding:6px 0; }
.data-actions{ display:grid; gap:8px; margin-top:24px; }
.data-actions .btn{ min-height:48px; justify-content:center; font-size:14px; }
.data-actions h3{ font-size:15px; margin:6px 0 2px; }

/* totaux */
.stats-section{ display:block; padding:0; }
.stats-section > *{ margin-bottom:14px; }

/* tab bar */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  display:grid; grid-template-columns: 1fr 1fr 76px 1fr 1fr; align-items:end;
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom,0px));
  background: rgba(14,20,32,.96); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top:1px solid var(--line);
}
.tabbar [data-tab]{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  min-height:56px; background:none; border:0; color:var(--ink-soft); font-size:11.5px; font-weight:600;
}
.tabbar [data-tab] svg{ width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.tabbar [data-tab].active{ color:var(--forest); }
.tab-add{
  justify-self:center; align-self:center; width:58px; height:58px; margin-top:-22px; border-radius:50%; border:0;
  background:linear-gradient(135deg,var(--forest),var(--navy)); color:var(--paper);
  font-size:32px; font-weight:400; line-height:1; box-shadow: 0 6px 20px rgba(0,0,0,.5), 0 0 22px rgba(45,226,230,.35);
}
.tab-add:active{ transform:scale(.96); }

.toast{ bottom: calc(100px + env(safe-area-inset-bottom,0px)) !important; }

/* fenêtres : feuille plein-largeur en bas d'écran */
@media (max-width:700px){
  .modal-overlay{ align-items:flex-end !important; padding:0 !important; }
  .modal{ width:100% !important; max-width:none !important; max-height:92vh; overflow-y:auto; border-radius:20px 20px 0 0 !important; padding-bottom:calc(22px + env(safe-area-inset-bottom,0px)); }
  .field input, .field select{ font-size:16px; min-height:46px; }
  .field-row{ grid-template-columns:1fr; gap:0; }
  .modal-close{ width:44px; height:44px; margin:-8px -8px 0 0; font-size:24px; }
  .modal-actions .btn{ min-height:46px; }
  .month-grid .chip{ font-size:0; width:7px; height:7px; min-height:0; padding:0; border-radius:50%; border:0; display:inline-block; }
  .month-grid .chip-div{ background:var(--gold); }
  .month-grid .chip-earn{ background:var(--navy); }
  .month-grid .chip.estimate{ opacity:.55; background:transparent; border:1.5px solid currentColor; box-sizing:border-box; }
  .month-grid .chip-div.estimate{ color:var(--gold); }
  .month-grid .chip-earn.estimate{ color:var(--navy); }
  .day-chips{ flex-direction:row; flex-wrap:wrap; gap:4px; }
  .month-grid .chip-more{ font-size:10px; }
  .month-dow{ font-size:11px; }
}
.notif-status{ font-size:13px; color:var(--ink-soft); margin:0 0 10px; line-height:1.45; }
.notif-actions{ display:grid; gap:8px; margin-bottom:8px; }
.notif-actions .btn{ min-height:46px; justify-content:center; }
@media (min-width:701px){ .tabbar{ left:50%; right:auto; width:560px; transform:translateX(-50%); border-radius:20px 20px 0 0; border:1px solid var(--line); border-bottom:0; } }

/* corrections de lisibilité */
body{ background:
  radial-gradient(ellipse 900px 500px at 15% -10%, rgba(45,226,230,0.10), transparent 60%),
  radial-gradient(ellipse 700px 500px at 100% 10%, rgba(157,107,255,0.09), transparent 55%),
  var(--paper); }
.next-hint{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); font-size:12.5px; color:var(--ink-soft); line-height:1.4; }
.holdings-group-label{ border-top:0 !important; padding-top:0 !important; font-family:var(--font-body); text-transform:none; letter-spacing:0; }
.filters{ align-items:center; }
.filters label.checkbox{ min-height:40px; }
@media (max-width:700px){
  .modal-actions{ position:sticky; bottom:calc(-22px - env(safe-area-inset-bottom,0px)); margin:22px -22px calc(-22px - env(safe-area-inset-bottom,0px)); padding:12px 22px calc(12px + env(safe-area-inset-bottom,0px)); background:var(--card); border-top:1px solid var(--line); }
}
.pay-amt .conf{ color:var(--forest); font-weight:600; }
.pay-amt .conf.soft{ color:var(--ink-soft); font-weight:400; }
.app-bar h1{ display:flex; align-items:center; gap:10px; }
.app-logo{ width:34px; height:34px; border-radius:9px; }
</style>
</head>
<body>

<header class="app-bar">
  <h1><img src="logo.svg" alt="" class="app-logo">Dividendes</h1>
  <div class="app-bar-actions">
    <button class="btn btn-ghost btn-icon" id="accountsBtn" title="Comptes" aria-label="Comptes">👛</button>
    <button class="btn btn-ghost btn-icon" id="settingsBtn" title="Réglages" aria-label="Réglages">⚙</button>
  </div>
</header>

<nav class="chips" id="accountSwitch" aria-label="Comptes"></nav>

<main class="screens">

  <!-- 1. À VENIR -->
  <section class="screen active" id="screen-upcoming" aria-label="Prochains versements">
    <div class="notif-banner" id="notifBanner" hidden></div>
    <div id="upcomingHero"></div>
    <div id="upcomingList"></div>
  </section>

  <!-- 2. CALENDRIER -->
  <section class="screen" id="screen-calendar" aria-label="Calendrier">
    <h2 class="screen-title">Calendrier</h2>
    <div class="cal-controls">
      <div class="view-switch" id="viewSwitch">
        <button data-mode="month" class="active">Mois</button>
        <button data-mode="year">Année</button>
        <button data-mode="logos">Logos</button>
      </div>
      <div class="date-nav">
        <button id="prevBtn" aria-label="Précédent">‹</button>
        <span id="periodLabel" class="mono"></span>
        <button id="nextBtn" aria-label="Suivant">›</button>
        <button id="todayBtn" class="btn btn-ghost">Aujourd'hui</button>
      </div>
      <div class="filters">
        <label>Date affichée
          <select id="dateTypeSelect">
            <option value="pay">Mise en paiement</option>
            <option value="ex">Ex-dividende</option>
          </select>
        </label>
        <label class="checkbox">
          <input type="checkbox" id="showEarningsCheckbox" checked/> Résultats
        </label>
      </div>
    </div>
    <div class="logo-legend" id="logoLegend" style="display:none;">
      <span><span class="dot" style="background:var(--gold);"></span>Contour or = dividende</span>
      <span><span class="dot" style="background:var(--navy);"></span>Contour violet = résultats</span>
      <span><span class="dot" style="background:var(--ink-soft); opacity:.55;"></span>Estompé = estimé</span>
    </div>
    <section class="calendar-wrap" id="calendarWrap"></section>
  </section>

  <!-- 3. PORTEFEUILLE -->
  <section class="screen" id="screen-portfolio" aria-label="Portefeuille">
    <h2 class="screen-title">Portefeuille</h2>
    <div class="portfolio-card sidebar-summary" id="summaryBox" style="margin-top:0;border-top:1px solid var(--line);padding-top:14px;"></div>
    <div class="holdings-list" id="holdingsList"></div>
    <div class="data-actions">
      <h3>Importer et sauvegarder</h3>
      <button class="btn btn-ghost" id="brokerImportBtn" type="button">📄 Importer un relevé (CSV / Excel)</button>
      <input type="file" id="brokerImportFile" accept=".csv,.xlsx,.xls" style="display:none" />
      <button class="btn btn-ghost" id="bulkFetchBtn" type="button">🔄 Compléter les lignes automatiquement</button>
      <button class="btn btn-ghost" id="exportBtn" type="button">Exporter une sauvegarde (JSON)</button>
      <button class="btn btn-ghost" id="importBtn" type="button">Restaurer une sauvegarde (JSON)</button>
      <input type="file" id="importFile" accept="application/json" style="display:none" />
      <p class="fine-print">Les données restent dans ce navigateur. Exportez une sauvegarde pour les passer d'un appareil à l'autre.</p>
    </div>
  </section>

  <!-- 4. TOTAUX -->
  <section class="screen" id="screen-totals" aria-label="Totaux">
    <h2 class="screen-title">Totaux</h2>
    <section class="stats-section" id="statsSection"></section>
  </section>

</main>

<nav class="tabbar" aria-label="Navigation">
  <button data-tab="upcoming" class="active" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>À venir
  </button>
  <button data-tab="calendar" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Calendrier
  </button>
  <button class="tab-add" id="addStockBtn" type="button" aria-label="Ajouter une action">+</button>
  <button data-tab="portfolio" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="7" width="17" height="12.5" rx="2.5"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M3.5 12.5h17"/></svg>Portefeuille
  </button>
  <button data-tab="totals" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-7"/></svg>Totaux
  </button>
</nav>

<div id="modalRoot"></div>

<script src="payouts.js"></script>
<script src="app.js"></script>
</body>
</html>
