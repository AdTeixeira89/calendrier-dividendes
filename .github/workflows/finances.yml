name: Finances — CI

on:
  push:
    paths: ['finances/**', '.github/workflows/finances.yml']
  pull_request:
    paths: ['finances/**', '.github/workflows/finances.yml']

defaults:
  run:
    working-directory: finances

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: finances/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:rules
