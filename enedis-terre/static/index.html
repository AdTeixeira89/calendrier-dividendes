<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Préparation mises à la terre Enedis</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1b2430; --card:#fff; --line:#d9dee5; --acc:#0b5cab; --warn:#a45a00; --bad:#b3261e; --ok:#1d7a3a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12161c; --fg:#e6eaf0; --card:#1b212a; --line:#323b48; --acc:#6aa9f0; --warn:#e0a24a; --bad:#f2827a; --ok:#6fcf8c; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:1200px; margin:0 auto; padding:16px; }
  h1 { font-size:1.3rem; } h2 { font-size:1.05rem; margin:0 0 8px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:14px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  button, select, input { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); }
  button.primary { background:var(--acc); color:#fff; border-color:var(--acc); }
  button:disabled { opacity:.5; }
  .tablewrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:.9rem; }
  th, td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  .err { color:var(--bad); } .warn { color:var(--warn); } .ok { color:var(--ok); } .muted { opacity:.7; }
  .tag { display:inline-block; padding:1px 7px; border-radius:10px; border:1px solid var(--line); font-size:.8rem; }
  .map { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:8px; }
  .map label { display:flex; flex-direction:column; font-size:.85rem; }
  .kpis { display:flex; flex-wrap:wrap; gap:8px; } .kpi { border:1px solid var(--line); border-radius:6px; padding:6px 10px; }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <h1>Préparation des mises à la terre — Import du listing</h1>
  <p class="muted">Sprint 1 : import, détection RM / RNG, seuils (RM &gt; 30 Ω, RNG &gt; 15 Ω). Aucune donnée n'est inventée : valeur absente = absente.</p>

  <section id="s-upload">
    <h2>1. Fichier</h2>
    <div class="row">
      <input type="file" id="file" accept=".xlsx,.csv,.txt,.pdf">
      <select id="sheet" class="hidden"></select>
      <button class="primary" id="btn-preview">Analyser</button>
    </div>
    <div id="upload-msg"></div>
  </section>

  <section id="s-map" class="hidden">
    <h2>2. Correspondance des colonnes</h2>
    <div class="row"><label>Ligne d'en-tête (0 = 1ère ligne) <input type="number" id="header-row" min="0" style="width:5em"></label></div>
    <div id="map" class="map"></div>
    <div id="map-msg"></div>
    <div class="tablewrap"><table id="sample"></table></div>
    <div class="row"><button id="btn-recheck">Recalculer l'aperçu</button></div>
  </section>

  <section id="s-plan" class="hidden">
    <h2>3. Aperçu et validation</h2>
    <div id="kpis" class="kpis"></div>
    <div id="plan-msg"></div>
    <div class="tablewrap"><table id="plan"></table></div>
    <div class="row" style="margin-top:8px"><button class="primary" id="btn-commit">Valider l'import</button></div>
    <div id="commit-msg"></div>
  </section>

  <section>
    <h2>Interventions</h2>
    <div class="row">
      <select id="f-type"><option value="">RM + RNG</option><option>RM</option><option>RNG</option></select>
      <select id="f-status"><option value="">Tous statuts</option><option value="to_prepare">À préparer</option><option value="incomplete">Incomplète</option></select>
      <input id="f-commune" placeholder="Commune">
      <input id="f-q" placeholder="Référence / adresse / poste">
      <button id="btn-filter">Filtrer</button>
    </div>
    <div class="tablewrap"><table id="list"></table></div>
    <div id="detail"></div>
  </section>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const el = (tag, props = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) { if (k === "class") e.className = v; else e[k] = v; }
  for (const k of kids) e.append(k);
  return e;
};
let current = null; // dernier aperçu
const STATUS = { to_prepare: "À préparer", incomplete: "Incomplète" };
const MEAS = { triggered: "Déclenchée", below: "≤ seuil", invalid: "Invalide" };
const DECISION = { new: "À importer", duplicate_reference: "Doublon (ignoré)", possible_duplicate: "Doublon potentiel" };

async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail || body));
  return body;
}
function form(extra = {}) {
  const f = new FormData();
  f.append("file", $("file").files[0]);
  for (const [k, v] of Object.entries(extra)) if (v !== null && v !== undefined && v !== "") f.append(k, v);
  return f;
}
function say(id, text, cls) { const e = $(id); e.replaceChildren(); if (text) e.append(el("p", { class: cls || "", textContent: text })); }
function currentMapping() {
  const m = {};
  document.querySelectorAll("#map select").forEach(s => { if (s.value !== "") m[s.dataset.field] = Number(s.value); });
  return m;
}
async function preview(first) {
  if (!$("file").files[0]) return say("upload-msg", "Choisir un fichier.", "err");
  say("upload-msg", "Analyse…");
  try {
    current = await api("/api/imports/preview", { method: "POST", body: form({
      sheet: $("sheet").value, header_row: first ? "" : $("header-row").value,
      mapping: first ? "" : JSON.stringify(currentMapping()) }) });
  } catch (e) { return say("upload-msg", e.message, "err"); }
  say("upload-msg", `Fichier ${current.kind.toUpperCase()} lu : ${current.headers.length} colonnes.`, "ok");
  render();
}
function render() {
  const sh = $("sheet");
  if (current.sheets.length > 1) { sh.classList.remove("hidden"); sh.replaceChildren(...current.sheets.map(n => el("option", { value: n, textContent: n, selected: n === current.sheet }))); }
  else sh.classList.add("hidden");
  $("s-map").classList.remove("hidden");
  $("header-row").value = current.header_row;
  const map = $("map"); map.replaceChildren();
  for (const [field, label] of Object.entries(current.field_labels)) {
    const s = el("select"); s.dataset.field = field;
    s.append(el("option", { value: "", textContent: "— non utilisée —" }));
    current.headers.forEach((h, i) => s.append(el("option", { value: i, textContent: h, selected: current.mapping[field] === i })));
    map.append(el("label", {}, label, s));
  }
  const msgs = [...current.errors.map(t => ["err", t]), ...current.warnings.map(t => ["warn", t])];
  $("map-msg").replaceChildren(...msgs.map(([c, t]) => el("p", { class: c, textContent: t })));
  const t = $("sample"); t.replaceChildren(el("tr", {}, ...current.headers.map(h => el("th", { textContent: h }))));
  current.sample_rows.forEach(r => t.append(el("tr", {}, ...r.map(c => el("td", { textContent: c ?? "" })))));
  renderPlan();
}
function renderPlan() {
  const sec = $("s-plan");
  if (current.errors.length) { sec.classList.add("hidden"); return; }
  sec.classList.remove("hidden");
  const s = current.summary;
  const labels = [["rows_read", "Lignes lues"], ["rm_triggered", "RM > 30 Ω"], ["rng_triggered", "RNG > 15 Ω"], ["incomplete", "Incomplètes (GPS)"],
    ["below_threshold", "≤ seuil"], ["invalid_values", "Valeurs invalides"], ["duplicates_skipped", "Doublons ignorés"], ["possible_duplicates", "Doublons à confirmer"]];
  $("kpis").replaceChildren(...labels.map(([k, l]) => el("div", { class: "kpi", textContent: `${l} : ${s[k]}` })));
  const t = $("plan"); t.replaceChildren(el("tr", {}, ...["Ligne", "Référence", "Type", "Valeur", "Mesure", "Décision", "Confirmer", "Remarques"].map(h => el("th", { textContent: h }))));
  current.items.forEach((it, idx) => {
    const cb = el("input", { type: "checkbox" }); cb.dataset.idx = idx;
    const notes = [it.detail, ...it.issues.map(i => i.message)].filter(Boolean);
    t.append(el("tr", {}, el("td", { textContent: it.source_row }), el("td", { textContent: it.reference ?? "—" }),
      el("td", {}, el("span", { class: "tag", textContent: it.earth_type })), el("td", { textContent: it.value ?? "—" }),
      el("td", { textContent: MEAS[it.measure_status] }), el("td", { textContent: DECISION[it.decision] }),
      el("td", {}, it.decision === "possible_duplicate" ? cb : ""), el("td", { class: notes.length ? "warn" : "", textContent: notes.join(" · ") })));
  });
  current.row_issues.forEach(r => t.append(el("tr", {}, el("td", { textContent: r.source_row }), el("td", { textContent: r.reference ?? "—" }),
    el("td", { colSpan: 5, class: "err", textContent: "Ligne non exploitable" }), el("td", { class: "err", textContent: r.issues.map(i => i.message).join(" · ") }))));
}
async function commit() {
  const confirm = [...document.querySelectorAll("#plan input[type=checkbox]:checked")].map(c => {
    const it = current.items[c.dataset.idx]; return { source_row: it.source_row, earth_type: it.earth_type }; });
  try {
    const res = await api("/api/imports", { method: "POST", body: form({ mapping: JSON.stringify(currentMapping()),
      sheet: $("sheet").value, header_row: $("header-row").value, confirm_duplicates: JSON.stringify(confirm) }) });
    say("commit-msg", `Import #${res.import_id} enregistré : ${res.created_interventions} intervention(s) créée(s).`, "ok");
    loadList();
  } catch (e) { say("commit-msg", e.message, "err"); }
}
async function loadList() {
  const p = new URLSearchParams();
  for (const [k, id] of [["earth_type", "f-type"], ["status", "f-status"], ["commune", "f-commune"], ["q", "f-q"]]) if ($(id).value) p.set(k, $(id).value);
  const rows = await api("/api/interventions?" + p);
  const t = $("list");
  t.replaceChildren(el("tr", {}, ...["Réf.", "Type", "Valeur (Ω)", "Seuil", "Latitude", "Longitude", "Commune", "Statut", "Erreurs / manques", ""].map(h => el("th", { textContent: h }))));
  rows.forEach(r => t.append(el("tr", {}, el("td", { textContent: r.reference ?? "—" }), el("td", {}, el("span", { class: "tag", textContent: r.earth_type })),
    el("td", { textContent: r.value }), el("td", { textContent: "> " + r.threshold }), el("td", { textContent: r.latitude ?? "—" }), el("td", { textContent: r.longitude ?? "—" }),
    el("td", { textContent: r.commune ?? "—" }), el("td", { class: r.status === "incomplete" ? "err" : "ok", textContent: STATUS[r.status] }),
    el("td", { class: "warn", textContent: r.issues.map(i => i.message).join(" · ") }), el("td", {}, el("button", { textContent: "Fiche", onclick: () => showDetail(r.id) })))));
  if (!rows.length) t.append(el("tr", {}, el("td", { colSpan: 10, class: "muted", textContent: "Aucune intervention." })));
}
async function showDetail(id) {
  const d = await api("/api/interventions/" + id), box = $("detail");
  box.replaceChildren(el("h2", { textContent: `Fiche ${d.earth_type} — ${d.reference ?? "sans référence"}` }),
    el("p", { textContent: `Valeur ${d.value} Ω (seuil > ${d.threshold} Ω). Importée le ${d.created_at}, ligne ${d.source.source_row} du fichier (import #${d.source.import_id}).` }));
  const dl = el("table"); for (const [k, v] of Object.entries(d.source.raw)) dl.append(el("tr", {}, el("th", { textContent: k }), el("td", { textContent: v ?? "" })));
  box.append(el("h2", { textContent: "Ligne d'origine" }), dl);
  const lat = el("input", { placeholder: "Latitude", value: d.latitude ?? "" }), lon = el("input", { placeholder: "Longitude", value: d.longitude ?? "" });
  const msg = el("span");
  box.append(el("h2", { textContent: "Corriger les coordonnées (tracé dans le journal)" }),
    el("div", { class: "row" }, lat, lon, el("button", { textContent: "Enregistrer", onclick: async () => {
      try { await api(`/api/interventions/${id}/location`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ latitude: lat.value, longitude: lon.value }) });
        loadList(); showDetail(id); } catch (e) { msg.className = "err"; msg.textContent = e.message; } } }), msg));
  d.history.forEach(h => box.append(el("p", { class: "muted", textContent: `${h.ts} — ${h.action} ${JSON.stringify(h.details)}` })));
}
$("btn-preview").onclick = () => preview(true);
$("btn-recheck").onclick = () => preview(false);
$("sheet").onchange = () => preview(true);
$("btn-commit").onclick = commit;
$("btn-filter").onclick = loadList;
loadList();
</script>
</body>
</html>
